site_name: "mkdeck"
site_description: "Minimal HTML slide decks from Markdown or Python, served like mkdocs."
site_url: https://senthurayyappan.github.io/mkdeck/
repo_url: https://github.com/senthurayyappan/mkdeck
repo_name: senthurayyappan/mkdeck
strict: true

theme:
  name: shadcn
  show_title: true
  show_stargazers: false
  show_datetime: false

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Writing slides: writing-slides.md
  - Building from Python: python-api.md
  - Extending a deck: extending.md
  - API reference: api.md
plugins:
  - shadcn/search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            allow_inspection: false
            show_root_heading: true
            show_signature_annotations: true
            show_source: true

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - fenced_code
  - codehilite:
      guess_lang: false
  - toc:
      permalink: true
