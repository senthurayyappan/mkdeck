[project]
name = "mkdeck"
version = "0.1.0"
description = "Minimal HTML slide decks from Markdown or Python, served like mkdocs."
readme = "README.md"
authors = [{ name = "Senthur Ayyappan" }]
requires-python = ">=3.13"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "jinja2>=3.1",
    "markdown-it-py>=3",
    "markupsafe>=3",
    "mdit-py-plugins>=0.4",
    "pyyaml>=6",
    "typer>=0.21,<1",
    "watchfiles>=1",
]

[project.urls]
Repository = "https://github.com/senthurayyappan/mkdeck"
Documentation = "https://senthurayyappan.github.io/mkdeck/"

[build-system]
requires = ["uv_build>=0.12.5,<0.13"]
build-backend = "uv_build"

[project.scripts]
mkdeck = "mkdeck.cli:app"

[project.optional-dependencies]
check = [
    "playwright>=1.48",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=6",
    "pre-commit>=4",
    "ruff>=0.15.17",
    "ty>=0.0.72",
    "deptry>=0.24",
]
docs = [
    "mkdocs>=1.6.1,<2",
    "mkdocs-shadcn>=0.12,<0.13",
    "mkdocstrings[python]>=1,<2",
    "pymdown-extensions>=10",
]

[tool.ruff]
line-length = 120
target-version = "py313"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF", "N", "A", "T10", "PGH", "D"]
ignore = ["E501"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["D"]
"**/*.ipynb" = ["D", "E402", "I"]

[tool.ruff.format]
quote-style = "double"
docstring-code-format = true

[tool.ty.src]
include = ["src", "tests", ".github/scripts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-config", "--strict-markers", "--import-mode=importlib"]

[tool.coverage.run]
branch = true
source = ["src"]
omit = ["tests/*"]

[tool.coverage.report]
show_missing = true
skip_empty = true

[tool.deptry]
known_first_party = ["mkdeck"]
