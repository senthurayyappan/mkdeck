[project]
name = "python-template"
version = "0.1.0"
description = "A uv-first Python repository template"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.15", "ty>=0.0.72", "pyyaml>=6", "pre-commit>=4"]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
extend-exclude = [".template"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
