default_stages: [pre-commit]

# reveal.js, KaTeX, Roboto and three.js are vendored as released, so nothing
# rewrites them. Our own files under assets/ are still checked.
exclude: '^src/mkdeck/assets/(reveal\.js|katex|roboto|three)/'

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: check-toml
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace
  # Use the tool versions from uv.lock for local checks and CI.
  - repo: local
    hooks:
      - id: ruff
        name: Ruff lint
        entry: uv run ruff check --fix
        language: system
        types_or: [python, pyi, jupyter]
      - id: ruff-format
        name: Ruff format
        entry: uv run ruff format
        language: system
        types_or: [python, pyi, jupyter]
      - id: ty
        name: ty type check
        entry: uv run ty check
        language: system
        pass_filenames: false
        always_run: true
      - id: deptry
        name: Dependency checks
        entry: uv run deptry src
        language: system
        pass_filenames: false
        always_run: true

      - id: conventional-commit
        name: Conventional Commit message
        entry: uv run python .github/scripts/check_commit_message.py
        language: system
        stages: [commit-msg]
