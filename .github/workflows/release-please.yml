name: Release Please
on:
  push:
    branches: [main]
  workflow_dispatch:
env:
  # The uv release every job installs, so a new uv cannot change a release unannounced.
  # Dependabot does not bump this; raise it by hand now and then.
  UV_VERSION: "0.12.20"
permissions:
  contents: write
  pull-requests: write
  issues: write
concurrency:
  group: release-please
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      # `github.token` must not open the release pull request. GitHub does not
      # run workflows on events that token creates, so CI on the release pull
      # request never starts. `RELEASE_PLEASE_TOKEN` is the credential that
      # lets those workflows run. See CONTRIBUTING.md.
      - name: Require RELEASE_PLEASE_TOKEN
        env:
          RELEASE_PLEASE_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
        run: |
          if [ -z "${RELEASE_PLEASE_TOKEN}" ]; then
            echo "::error::RELEASE_PLEASE_TOKEN is not set. It is required so CI can run on the release pull request. The default GITHUB_TOKEN opens that pull request as github-actions[bot], and GitHub does not run workflows that token triggers."
            exit 1
          fi
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: .release-please-config.json
          manifest-file: .release-please-manifest.json

  # Publishing is split in two so that the code that builds the package never
  # holds the token that uploads it. `build` has read-only access; only
  # `publish` can mint the short-lived PyPI credential, and it runs nothing but
  # the upload.
  build:
    name: Build the release
    needs: release
    if: ${{ needs.release.outputs.release_created == 'true' }}
    timeout-minutes: 10
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release.outputs.tag_name }}
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
      - run: uv build --no-sources --clear
      - run: uvx twine==7.0.0 check --strict dist/*
      # Install the wheel into an empty virtualenv and run it, so a file left
      # out of the wheel fails the release instead of reaching PyPI.
      - run: uv run --no-project python scripts/smoke_wheel.py dist
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: [release, build]
    if: ${{ needs.release.outputs.release_created == 'true' }}
    timeout-minutes: 10
    runs-on: ubuntu-latest
    # Trusted publishing: PyPI accepts this workflow, in this environment, with
    # no API token stored anywhere. See CONTRIBUTING.md for the one-time setup.
    environment:
      name: pypi
      url: https://pypi.org/project/mkdeck/
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
